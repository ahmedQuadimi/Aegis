listener:
  port: 8080
  protocol: http
  tls_cert: "cert.pem"
  tls_key: "key.pem"

defaults:
  timeout_read: 5000    
  timeout_write: 10000  
  timeout_idle: 60000   
  timeout_connect: 2000 
  health_check_interval: 10000

routes:
  - host: "api.local"
    # cache_ttl: 10
    # rate_limit: 1
    # burst: 3
    balancer: "least_connections"
    cleanup_duration: 3000
    backends:
      - addr: "http://localhost:9090"
        health_check:
          method: "http"
          interval: 5000
          unhealthy_threshold: 1
          healthy_threshold: 2
      - addr: "http://localhost:9091"
        health_check:
          method: "http"
          interval: 5000
          unhealthy_threshold: 1
          healthy_threshold: 2
    retries: 3
    retry_buffer_size: 5242880
