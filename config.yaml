listener:
  port: 8080
  protocol: http

defaults:
  timeout_read: 5000    
  timeout_write: 10000  
  timeout_idle: 60000   
  timeout_connect: 2000 
  health_check_interval: 10000

routes:
  - host: "api.local"
    backends:
      - addr: "http://localhost:8081"
        health_check:
          method: "http"
          interval: 5000
          unhealthy_threshold: 1 # Dies on the first failure
          healthy_threshold: 2   # Needs two successes to come back
      - addr: "http://localhost:8082"
        health_check:
          method: "http"
          interval: 5000