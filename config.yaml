listener:
  port: 8080
  protocol: https
  tls_cert: "cert.pem"
  tls_key: "key.pem"

defaults:
  timeout_read: 5000    
  timeout_write: 10000  
  timeout_idle: 60000   
  timeout_connect: 2000 
  health_check_interval: 10000

routes:
  - host: "api.local"
    backends:
      - addr: "http://127.0.0.1:8081"
        health_check:
          method: "http"
          interval: 5000
          unhealthy_threshold: 1
          healthy_threshold: 2
      - addr: "http://127.0.0.1:8082"
        health_check:
          method: "http"
          interval: 5000
          unhealthy_threshold: 1
          healthy_threshold: 2
    retries: 3
    retry_buffer_size: 5242880