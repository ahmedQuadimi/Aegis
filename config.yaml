# 1. Listener Configuration
# Defines how the proxy accepts incoming traffic.
listener:
  port: 8080
  protocol: http

# 2. Observability (Toggleable)
# Set to 'true' to expose the /metrics endpoint for Prometheus.
observability:
  metrics_enabled: false

# 3. Distributed Architecture (Toggleable)
# Connects Aegis to Redis for distributed rate limiting.
redis:
  enabled: false
  addr: "localhost:6379"
  password: ""
  db: 0

# 4. Global Timeouts
# Protects the proxy from slow-loris attacks and hanging connections.
defaults:
  timeout_read: 5000   # Max time to read the request (ms)
  timeout_write: 5000  # Max time to write the response (ms)
  timeout_idle: 30000  # Keep-alive connection timeout (ms)

# 5. Routing Rules
# Define virtual hosts, their backends, and specific policies.
routes:
  - host: "api.local"
    balancer: "round_robin" # Options: round_robin, least_connections
    rate_limit: 5 # Requests per second allowed per IP
    cache_ttl: 0  # Time to cache responses in seconds (0 = disabled)
    
    backends:
      - addr: "http://localhost:9091"
        health_check:
          path: "/health"
          interval: 5000   # Milliseconds between checks
          timeout: 1000    # Milliseconds before check fails
          unhealthy_threshold: 3 # Failures before removing backend
          healthy_threshold: 2   # Successes before restoring backend
      
      - addr: "http://localhost:9092"
        health_check:
          path: "/health"
          interval: 5000
          timeout: 1000
          unhealthy_threshold: 3
          healthy_threshold: 2
