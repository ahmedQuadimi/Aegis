listener:
  port: 8080
  protocol: http
  # Pas de TLS pour ce test de performance pur

defaults:
  timeout_read: 5000    
  timeout_write: 10000  
  timeout_idle: 60000   
  timeout_connect: 2000 
  health_check_interval: 10000

routes:
  - host: "api.local"
    cache_ttl: 0        # ⚠️ CRUCIAL : Désactivé pour forcer le passage par le LB
    rate_limit: 0       # Désactivé pour ne pas freiner le test
    burst: 0
    balancer: "least-connections" # 🧠 L'algo que tu veux tester
    cleanup_duration: 3000
    retries: 3
    retry_buffer_size: 5242880
    
    backends:
      - addr: "http://127.0.0.1:9001" # 🐇 Le Serveur Rapide
        health_check:
          method: "http"
          interval: 5000
          unhealthy_threshold: 1
          healthy_threshold: 2

      - addr: "http://127.0.0.1:9002" # 🐢 Le Serveur Lent
        health_check:
          method: "http"
          interval: 5000
          unhealthy_threshold: 1
          healthy_threshold: 2
